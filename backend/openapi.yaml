  # ============ SOCKET.IO EVENTS ============
  /socket:
    description: |
      ## WebSocket Events (Socket.IO)
      
      Real-time chat is handled through Socket.IO WebSocket connections. Connect to the socket server with your JWT token.
      
      ### Connection
      ```
      const socket = io('http://localhost:3001', {
        auth: { token: 'your-jwt-token' }
      });
      ```
      
      ### Emitted Events (Client → Server)
      - **join-conversation**: Join a conversation room
        ```json
        { "conversationId": "uuid" }
        ```
      
      - **send-message**: Send real-time message
        ```json
        { "conversationId": "uuid", "content": "message text" }
        ```
      
      - **typing**: Send typing indicator (expires in 5 seconds)
        ```json
        { "conversationId": "uuid", "isTyping": true }
        ```
      
      - **mark-read**: Mark messages as read
        ```json
        { "conversationId": "uuid" }
        ```
      
      - **delete-message**: Delete message
        ```json
        { "messageId": "uuid" }
        ```
      
      - **leave-conversation**: Leave conversation room
        ```json
        { "conversationId": "uuid" }
        ```
      
      ### Received Events (Server → Client)
      - **new-message**: Broadcast new message to all participants
        ```json
        {
          "id": "uuid",
          "conversationId": "uuid",
          "senderId": "uuid",
          "senderName": "User Name",
          "content": "message",
          "timestamp": "2024-01-29T10:00:00Z"
        }
        ```
      
      - **user-typing**: User is typing
        ```json
        {
          "conversationId": "uuid",
          "userId": "uuid",
          "userName": "User Name"
        }
        ```
      
      - **user-joined**: User joined conversation
        ```json
        {
          "conversationId": "uuid",
          "userId": "uuid",
          "userName": "User Name"
        }
        ```
      
      - **messages-read**: Messages marked as read
        ```json
        {
          "conversationId": "uuid",
          "userId": "uuid"
        }
        ```

x-custom-notes: |
  ## Rate Limiting
  - No rate limiting currently implemented
  - Consider implementing for production deployments
  
  ## Error Handling
  All error responses follow the standard format:
  ```json
  {
    "success": false,
    "error": "Error message description"
  }
  ```
  
  ## Pagination
  - Chat messages support cursor-based pagination via `before` query parameter
  - Other list endpoints return all results (consider implementing for scale)
  
  ## MOQ Validation
  - Order creation automatically validates that requested quantities meet product MOQ requirements
  - Returns 400 error if MOQ not met
  
  ## Group Member Roles
  - **admin**: Can manage members, modify group settings
  - **member**: Can view group, participate in chat, create orders
  - **creator**: Automatically becomes admin when creating group
  
  ## Escrow Workflow
  1. Create transaction (status: locked)
  2. Payment made (status: locked)
  3. Item shipped (status: pending_inspection)
  4. Buyer confirms delivery (status: released)
  5. Seller receives payment
